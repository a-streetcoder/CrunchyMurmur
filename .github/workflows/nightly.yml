name: Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to publish the generated Nightly tag.
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
      - id: tag
        name: Create the Nightly tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          TAG="v${MAJOR}.$((MINOR + 1)).0-nightly.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" || true
          if git rev-parse --verify --quiet "$TAG^{commit}" >/dev/null; then
            test "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)" || {
              echo "Existing tag $TAG points to a different commit." >&2
              exit 1
            }
          else
            git tag -a "$TAG" -m "CrunchyMurmur $TAG"
            git push origin "$TAG"
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    permissions:
      contents: write # Required to publish release assets.
      id-token: write # Required for provenance identity.
      attestations: write # Required to publish build attestations.
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.tag.outputs.release_tag }}
    secrets: inherit

  cleanup:
    needs: [tag, release]
    if: ${{ always() && needs.tag.result == 'success' && needs.release.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to delete the orphaned Nightly tag.
    steps:
      - name: Delete the orphaned Nightly tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.release_tag }}
        # A bare tag with no release behind it appears in the releases.atom
        # feed the updater reads, which breaks update checks for everyone on
        # the Nightly channel. A failed run must not leave its tag behind.
        run: |
          set +e
          response=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Release $TAG exists; keeping the tag."
          elif echo "$response" | grep -q "HTTP 404"; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG"
            echo "Deleted orphaned tag $TAG."
          else
            # An auth, network, or rate-limit failure must never delete a
            # tag that may have a release behind it.
            echo "$response"
            echo "Could not determine whether release $TAG exists; keeping the tag." >&2
            exit 1
          fi
