<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'none'"
  >
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CrunchyMurmur SDK Chat</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="brand-copy">
        <h1>CrunchyMurmur SDK Chat</h1>
        <p data-i18n="subtitle"></p>
      </div>
      <div class="status" id="status" role="status" aria-live="polite">
        <span class="status-dot"></span>
        <span id="statusText" data-i18n="ready"></span>
      </div>
    </header>

    <details class="setup" id="setup">
      <summary data-i18n="settings"></summary>
      <div class="setup-grid">
        <label>
          <span data-i18n="modelDirectory"></span>
          <input id="modelDirectory" type="text" spellcheck="false" autocomplete="off">
        </label>
        <label>
          <span data-i18n="digest"></span>
          <input id="digest" type="text" spellcheck="false" autocomplete="off" maxlength="64">
        </label>
        <label>
          <span data-i18n="language"></span>
          <select id="language">
            <option value="auto">Auto</option>
            <option value="en">English</option>
            <option value="it">Italiano</option>
            <option value="es">Español</option>
            <option value="pt">Português</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="da">Dansk</option>
            <option value="no">Norsk</option>
            <option value="sv">Svenska</option>
            <option value="ru">Русский</option>
            <option value="uk">Українська</option>
          </select>
        </label>
        <button class="secondary" id="saveSetup" type="button" data-i18n="save"></button>
      </div>
    </details>

    <section class="conversation" id="conversation" aria-live="polite">
      <div class="empty-state" id="emptyState">
        <div class="empty-orb" aria-hidden="true"></div>
        <p data-i18n="empty"></p>
      </div>
    </section>

    <section class="composer" aria-label="Message composer">
      <textarea
        id="message"
        rows="1"
        maxlength="4000"
        data-i18n-placeholder="placeholder"
      ></textarea>
      <button class="record" id="record" type="button">
        <span class="record-icon" aria-hidden="true"></span>
        <span id="recordLabel" data-i18n="record"></span>
      </button>
      <button class="send" id="send" type="button" data-i18n="send"></button>
    </section>
  </main>
  <script src="./i18n.js"></script>
  <script src="./renderer.js"></script>
</body>
</html>
