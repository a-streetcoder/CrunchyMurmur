[package]
name = "crunchymurmur-transcriber"
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT"
description = "Local-first, on-device transcription engine used by CrunchyMurmur desktop adapters"
repository = "https://github.com/a-streetcoder/CrunchyMurmur"
homepage = "https://github.com/a-streetcoder/CrunchyMurmur/tree/main/native/transcriber"
readme = "README.md"
keywords = ["transcription", "speech-to-text", "on-device", "parakeet"]
categories = ["multimedia::audio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
transcribe-rs = { version = "=0.3.11", features = ["onnx"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
